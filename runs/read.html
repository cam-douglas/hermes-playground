<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Read an hourly hermes-playground ship log as a page." />
    <title>hermes-playground | log reader</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --panel: rgba(13, 17, 30, 0.82);
        --line: rgba(148, 163, 184, 0.16);
        --text: #e9f1ff;
        --muted: #9db0d1;
        --warn: #fbbf24;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(251, 191, 36, 0.12), transparent 28%),
          linear-gradient(180deg, #050812 0%, #090d18 100%);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .wrap { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 72px; }
      .bar {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        margin-bottom: 20px; color: var(--muted); font-size: 14px;
      }
      .pill {
        display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px;
        border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.03);
      }
      .nav {
        display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;
      }
      .nav a {
        display: inline-flex; align-items: center; padding: 8px 12px;
        border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.03);
        color: var(--muted); font-size: 13px;
      }
      .nav a[aria-disabled="true"] {
        opacity: 0.35; pointer-events: none;
      }
      .nav a:hover, .nav a:focus, .nav a:focus-visible {
        border-color: rgba(251, 191, 36, 0.45); background: rgba(251, 191, 36, 0.1);
        color: #fde68a; outline: none;
      }
      .page {
        padding: 32px; border: 1px solid var(--line); border-radius: 28px;
        background: linear-gradient(180deg, rgba(19, 23, 38, 0.96), rgba(9, 12, 22, 0.92));
        box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      }
      .eyebrow {
        display: inline-flex; padding: 6px 12px; border-radius: 999px;
        border: 1px solid rgba(251, 191, 36, 0.28); background: rgba(251, 191, 36, 0.1);
        color: #fde68a; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
      }
      .page h1 { margin: 18px 0 16px; font-size: clamp(28px, 5vw, 48px); line-height: 1.05; letter-spacing: -0.04em; }
      .page h2 {
        margin: 28px 0 10px; font-size: 15px; letter-spacing: 0.06em;
        text-transform: uppercase; color: #fde68a;
      }
      .page p { margin: 0 0 14px; color: #d8e6fb; font-size: 16px; line-height: 1.55; }
      .page ul { margin: 0 0 16px; padding: 0 0 0 1.15em; color: #d8e6fb; }
      .page li { margin: 0 0 8px; line-height: 1.5; }
      .page code {
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 1px 6px; border-radius: 6px;
        border: 1px solid rgba(148,163,184,0.2); background: rgba(255,255,255,0.04);
        color: #fde68a;
      }
      .page strong { color: #fff; font-weight: 600; }
      .msg {
        margin: 0; padding: 18px 16px; border-radius: 16px;
        border: 1px solid rgba(251, 191, 36, 0.35); background: rgba(251, 191, 36, 0.08);
        color: #fde68a; font-size: 16px; line-height: 1.5;
      }
      .meta { margin-top: 22px; color: var(--muted); font-size: 13px; }
      .meta a { text-decoration: underline; text-underline-offset: 3px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bar">
        <div class="pill">hourly work log • a page, not a download</div>
        <a class="pill" href="/">← catalogue</a>
      </div>
      <nav class="nav" aria-label="Log reader">
        <a href="/">Catalogue</a>
        <a href="/runs/">All hours</a>
        <a id="nav-newer" href="#" aria-disabled="true">Newer</a>
        <a id="nav-older" href="#" aria-disabled="true">Older</a>
        <a id="nav-raw" href="/runs/" hidden>Raw .md</a>
      </nav>
      <main class="page">
        <div class="eyebrow" id="eyebrow">Runs · reader</div>
        <div id="status" class="msg" hidden></div>
        <article id="log" hidden></article>
        <p class="meta" id="meta">
          Stem only — no path, no <code>..</code>. The markdown file stays the source of truth.
        </p>
      </main>
    </div>
    <script>
      const STEM_RE = /^(README|[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]{4})?)$/;
      const README_ENTRY = { stem: 'README', title: 'About these logs', kind: 'about' };

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function inline(value) {
        return escapeHtml(value)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      }

      function renderMarkdown(markdown) {
        const lines = String(markdown).replace(/\r\n/g, '\n').split('\n');
        const html = [];
        let title = '';
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          if (line.startsWith('# ')) {
            const text = line.slice(2).trim();
            if (!title) title = text;
            html.push('<h1>' + inline(text) + '</h1>');
            i += 1;
            continue;
          }
          if (line.startsWith('## ')) {
            html.push('<h2>' + inline(line.slice(3).trim()) + '</h2>');
            i += 1;
            continue;
          }
          if (line.startsWith('- ')) {
            const items = [];
            while (i < lines.length && lines[i].startsWith('- ')) {
              items.push('<li>' + inline(lines[i].slice(2).trim()) + '</li>');
              i += 1;
            }
            html.push('<ul>' + items.join('') + '</ul>');
            continue;
          }
          if (!line.trim()) {
            i += 1;
            continue;
          }
          const para = [];
          while (i < lines.length && lines[i].trim() && !lines[i].startsWith('# ') && !lines[i].startsWith('## ') && !lines[i].startsWith('- ')) {
            para.push(lines[i].trim());
            i += 1;
          }
          html.push('<p>' + inline(para.join(' ')) + '</p>');
        }
        return { html: html.join(''), title: title };
      }

      function showError(message) {
        document.title = 'Log not on this desk';
        document.getElementById('eyebrow').textContent = 'Runs · not a log';
        const status = document.getElementById('status');
        status.hidden = false;
        status.textContent = message;
        document.getElementById('log').hidden = true;
        document.getElementById('nav-raw').hidden = true;
      }

      function setNav(href, disabled) {
        href.setAttribute('aria-disabled', disabled ? 'true' : 'false');
        if (disabled) href.removeAttribute('href');
      }

      function resolveStem(raw, logs) {
        if (raw == null || raw === '') {
          return { error: 'No log specified. Use a filename stem, for example ?log=2026-08-20-2250.' };
        }
        if (raw.includes('/') || raw.includes('\\') || raw.includes('..') || raw.includes('.') || raw.includes('%')) {
          return { error: 'That is not a log on this desk. Use a filename stem only — no path, no dots, no ..' };
        }
        if (!STEM_RE.test(raw)) {
          return { error: 'That is not a log on this desk. Hours look like 2026-08-20-2250; days look like 2026-08-19.' };
        }
        const entry = logs.find((item) => item.stem === raw);
        if (!entry) {
          return { error: 'That stem is not on the allowlist of files that exist under /runs/.' };
        }
        return { entry: entry };
      }

      function withReadme(hours) {
        const logs = Array.isArray(hours) ? hours.slice() : [];
        if (!logs.some((item) => item.stem === 'README')) logs.push(README_ENTRY);
        return logs;
      }

      function startWithLogs(logs) {
        const params = new URLSearchParams(window.location.search);
        const resolved = resolveStem(params.get('log'), logs);
        const newer = document.getElementById('nav-newer');
        const older = document.getElementById('nav-older');
        if (resolved.error) {
          setNav(newer, true);
          setNav(older, true);
          showError(resolved.error);
          return;
        }

        const index = logs.findIndex((item) => item.stem === resolved.entry.stem);
        if (index > 0) {
          newer.href = '/runs/read.html?log=' + encodeURIComponent(logs[index - 1].stem);
          newer.removeAttribute('aria-disabled');
        } else {
          setNav(newer, true);
        }
        if (index >= 0 && index < logs.length - 1) {
          older.href = '/runs/read.html?log=' + encodeURIComponent(logs[index + 1].stem);
          older.removeAttribute('aria-disabled');
        } else {
          setNav(older, true);
        }

        const raw = document.getElementById('nav-raw');
        raw.href = '/runs/' + resolved.entry.stem + '.md';
        raw.hidden = false;

        document.getElementById('eyebrow').textContent = 'Runs · ' + resolved.entry.title;
        document.getElementById('meta').innerHTML =
          'Source of truth: <a href="/runs/' + resolved.entry.stem + '.md"><code>/runs/' +
          resolved.entry.stem + '.md</code></a>. This page only reads it.';

        fetch('/runs/' + resolved.entry.stem + '.md')
          .then(function (response) {
            if (!response.ok) {
              throw new Error('fetch-' + response.status);
            }
            return response.text();
          })
          .then(function (markdown) {
            const rendered = renderMarkdown(markdown);
            document.title = rendered.title || resolved.entry.title;
            const article = document.getElementById('log');
            article.hidden = false;
            article.innerHTML = rendered.html;
            document.getElementById('status').hidden = true;
          })
          .catch(function () {
            showError('The allowlisted file could not be fetched. The markdown may be missing from this origin.');
          });
      }

      (function start() {
        const newer = document.getElementById('nav-newer');
        const older = document.getElementById('nav-older');
        fetch('/runs/hours.json')
          .then(function (response) {
            if (!response.ok) throw new Error('hours-' + response.status);
            return response.json();
          })
          .then(function (hours) {
            if (!Array.isArray(hours) || !hours.length) throw new Error('hours-empty');
            startWithLogs(withReadme(hours));
          })
          .catch(function () {
            setNav(newer, true);
            setNav(older, true);
            showError('The hours list could not be loaded. No stem is allowed until /runs/hours.json returns.');
          });
      })();
    </script>
  </body>
</html>
